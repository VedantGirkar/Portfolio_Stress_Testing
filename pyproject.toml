[project]
name = "stress-portfolio"
version = "0.1.0"
description = "Stress-tested equity portfolio research platform with derivative hedging"
readme = "README.md"
authors = [
    { name = "Vedant Girkar", email = "vedantgirkar32@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[project.scripts]
stress-portfolio = "stress_portfolio.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
